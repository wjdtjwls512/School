<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>대소고 카페</title>
    <link rel="stylesheet" href="/css/web02_cafe.css" />
    <link
      rel="stylesheet"
      href="https://cdn-uicons.flaticon.com/uicons-solid-straight/css/uicons-solid-straight.css"
    />
  </head>
  <body>
    <h1 class="single-day-regular">
      <i class="fi fi-ss-mug-hot-alt"></i>DGSW 카페
    </h1>
    <p class="single-day-regular">
      정성껏 내린 커피와 함께 당신만의 소중한 시간을 채워보세요.
    </p>
    <p class="single-day-regular">
      바쁜 하루 중 잠시 숨을 고를 수 있는 곳 DGSW 카페입니다.
    </p>
    <hr />
    <h2 class="t_center">MENU</h2>

    <table style="float: left; margin-right: 20px">
      <caption class="t_cap">
        카페 메뉴 정보
      </caption>
      <colgroup>
        <col style="background-color: cornsilk" />
        <col />
        <col />
      </colgroup>
      <thead>
        <tr>
          <th>구분</th>
          <th>메뉴명</th>
          <th>가격</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td rowspan="2" class="t_bold">coffee</td>
          <td>아메리카노</td>
          <td>2,500원</td>
        </tr>
        <tr>
          <td>카페라떼</td>
          <td>3,500원</td>
        </tr>
        <tr>
          <td rowspan="2" class="t_bold">Non-Coffee</td>
          <td>딸기 스무디</td>
          <td>4,500원</td>
        </tr>
        <tr>
          <td>녹차라떼</td>
          <td>4,000원</td>
        </tr>
      </tbody>
      <tfoot>
        <tr>
          <td colspan="3">Hot/Cold 선택가능</td>
        </tr>
      </tfoot>
    </table>

    <table>
      <caption class="t_cap">
        디저트 메뉴 정보
      </caption>
      <colgroup>
        <col style="background-color: rgb(255, 218, 159)" />
        <col />
        <col />
      </colgroup>
      <thead>
        <tr>
          <th>구분</th>
          <th>메뉴명</th>
          <th>가격</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td rowspan="2" class="t_bold">Bread</td>
          <td>소금빵</td>
          <td>6,000원</td>
        </tr>
        <tr>
          <td>바게트</td>
          <td>4,500원</td>
        </tr>
        <tr>
          <td rowspan="3" class="t_bold">Cake</td>
          <td>스초생</td>
          <td>20,000원</td>
        </tr>
        <tr>
          <td>티라미수</td>
          <td>9,000원</td>
        </tr>
        <tr>
          <td>블루베리 케이크</td>
          <td>14,000원</td>
        </tr>
      </tbody>
    </table>

    <a href="../Html/web03_cafe.html" target="_blank">
      <input
        type="image"
        src="../images/req.png"
        alt="주문하러가기"
        width="100px"
      />
    </a>
